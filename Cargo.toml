[workspace]
resolver = "3"
members = [
    "crates/pilotage-frames",
    "crates/pilotage-alerts",
    "crates/pilotage-sha256",
    "crates/pilotage-instrument-scene",
    "crates/pilotage-instrument-state",
    "crates/pilotage-instrument-glyphs",
    "crates/pilotage-instrument-symbology",
    "crates/pilotage-instrument-panels",
    "crates/pilotage-instrument-raster",
    "crates/pilotage-instrument-conformance",
    "crates/pilotage-instrument-feeder",
    "crates/pilotage-instrument-registry",
    "crates/pilotage-evidence",
    "tools/instrument-bench",
    "tools/xtask",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
libm = "0.2.16"
thiserror = { version = "2.0.18", default-features = false }
proptest = "1.11.0"
sha2 = "0.10.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
pilotage-frames = { path = "crates/pilotage-frames" }
pilotage-alerts = { path = "crates/pilotage-alerts" }
pilotage-sha256 = { path = "crates/pilotage-sha256" }
pilotage-instrument-scene = { path = "crates/pilotage-instrument-scene" }
pilotage-instrument-state = { path = "crates/pilotage-instrument-state" }
pilotage-instrument-glyphs = { path = "crates/pilotage-instrument-glyphs" }
pilotage-instrument-symbology = { path = "crates/pilotage-instrument-symbology" }
pilotage-instrument-panels = { path = "crates/pilotage-instrument-panels" }
pilotage-instrument-raster = { path = "crates/pilotage-instrument-raster" }
pilotage-instrument-conformance = { path = "crates/pilotage-instrument-conformance" }
pilotage-instrument-feeder = { path = "crates/pilotage-instrument-feeder" }
pilotage-instrument-registry = { path = "crates/pilotage-instrument-registry" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
