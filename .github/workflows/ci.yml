name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FIXTURES: crates/indicate-evidence/tests/fixtures

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Evidence baseline membership resolves declared configuration
          # commits against real history; a shallow clone would make every
          # recorded baseline unverifiable.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D missing_docs -D rustdoc::broken_intra_doc_links"
        run: cargo doc --locked --no-deps

      - name: cargo build --release
        run: cargo build --locked --release

      - name: check-structure
        run: bash scripts/check-structure.sh

      - name: instrument requirement references
        run: bash scripts/check-instrument-requirements.sh

      - name: certification-claim guard (AIR-03)
        # Fail on any tracked doc artifact that asserts a certification,
        # compliance, approval, or airworthiness claim about this SIM project.
        run: bash scripts/check-certification-claims.sh

      - name: standards registry drift guard (AIR-04)
        # Keep the standards registry honest and the applicability matrix in
        # sync with it: fail closed on an absent/empty registry, on missing
        # status provenance, on contradictory active/superseded
        # classifications, and on matrix drift. This checks internal
        # consistency only and does not prove external freshness, which
        # remains a human source review.
        run: bash scripts/check-standards-registry.sh

      - name: instrument trace inventory (AIR-03)
        # Emit a requirement/test/review/configuration inventory to the log.
        # This is an inventory, not a compliance trace, and fabricates nothing.
        run: bash scripts/trace-report.sh

      - name: the family is downstream-agnostic
        # The family is a CLOSED set: any ecosystem crate in the dependency
        # graph beyond the allowlist below means the boundary leaked — no
        # wire protocol, no host, no shell, nothing from a consumer.
        # Consumers pin this repository, never the reverse (see
        # docs/instruments/backend-contract.md). The check reads Cargo.lock
        # because the lock records every edge kind, dev-dependencies
        # included; a denylist of known consumer names would false-negative
        # on the next crate the ecosystem grows.
        run: |
          known="indicate-frames indicate-alerts indicate-sha256 \
                 indicate-instrument-scene indicate-instrument-state \
                 indicate-instrument-glyphs indicate-instrument-symbology \
                 indicate-instrument-panels indicate-instrument-raster \
                 indicate-instrument-conformance indicate-instrument-feeder \
                 indicate-instrument-registry indicate-evidence \
                 instrument-bench"
          fail=0
          while read -r pkg; do
            case " $known " in
              *" $pkg "*) ;;
              *)
                echo "Cargo.lock names non-family crate $pkg; the family must stay downstream-agnostic"
                fail=1
                ;;
            esac
          # `indicate` is the family's own prefix and `pilotage` a consumer's:
          # both stay in the filter, so neither a family crate escaping the
          # allowlist nor a consumer crate reappearing goes unseen.
          done < <(grep -oE '^name = "(indicate|pilotage|avionics|navigate|aviate|instrument)[a-z0-9_-]*"' Cargo.lock \
                   | sed 's/^name = "//;s/"$//')
          # A filter that matches nothing reports a closed boundary it never
          # looked at. The family's own crates are the floor: fewer hits than
          # crates means the pattern stopped seeing them, which is how a
          # rename would silently blind this gate.
          seen=$(grep -cE '^name = "(indicate|pilotage|avionics|navigate|aviate|instrument)[a-z0-9_-]*"' Cargo.lock)
          floor=$(find crates -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$seen" -lt "$floor" ]; then
            echo "the downstream-agnostic filter matched $seen names but the tree has $floor crates; the pattern has gone blind"
            fail=1
          fi
          # Category sentinels the prefix filter cannot see: third-party
          # wire-protocol and transport crates mean the boundary leaked
          # regardless of what they are named.
          for banned in prost tonic wtransport quinn h3 quiche; do
            if grep -qE "^name = \"$banned(-[a-z0-9]+)*\"" Cargo.lock; then
              echo "Cargo.lock names $banned; wire-protocol and transport crates belong to consumers"
              fail=1
            fi
          done
          exit $fail

      - name: instrument closure is no_std, standalone
        # The closure compiles for a bare-metal target in ONE invocation
        # containing ONLY closure crates. The conformance harness is
        # deliberately absent: it is a host-side tool and allocates.
        run: >
          cargo check --locked
          -p indicate-frames
          -p indicate-alerts
          -p indicate-sha256
          -p indicate-instrument-state
          -p indicate-instrument-scene
          -p indicate-instrument-glyphs
          -p indicate-instrument-symbology
          -p indicate-instrument-panels
          -p indicate-instrument-raster
          -p indicate-instrument-feeder
          -p indicate-instrument-registry
          --target thumbv7em-none-eabihf

      - name: target timing gate (REN-04)
        # No display hardware is selected: the USB CDC scan documents that no
        # target is connected, and the envelope gate prices the per-class
        # work budget with the conservative model against the frame deadline
        # derived from the SIM display liveness requirement. The artifact
        # drift guard keeps the committed timing record equal to the shipped
        # model. The envelope is provisional — not a WCET claim — until a
        # measured target binds firmware, clock, memory, and compiler state.
        run: |
          bash scripts/detect-target.sh
          cargo test --locked -p indicate-instrument-raster timing

      - name: reference rasterizer frame hashes (REN-03)
        # Re-render every shipped panel and assert its pinned SHA-256 frame
        # hash, proving the software rasterizer is bit-reproducible.
        run: cargo test --locked -p indicate-instrument-raster

      - name: instrument bench shell conformance smoke
        # A shell built from the registry alone: runs admission and
        # reproduces the pinned composition digest on the host target.
        run: cargo run --locked -q -p instrument-bench

      - name: glyph pack integrity (REN-02)
        # Mandatory-vocabulary completeness, byte-identical reproducibility,
        # and fail-closed corruption detection for the controlled glyph pack.
        run: cargo test --locked -p indicate-instrument-glyphs

      - name: evidence gate — crate tests
        run: cargo test --locked -p indicate-evidence --all-targets

      - name: evidence trace — honest verdict and bidirectional trace
        # Informational: a review may honestly stay PENDING, and a pending
        # review must never block a merge, so the verdict step stays
        # advisory. Durable RESOLUTION is enforced by the hard steps below.
        continue-on-error: true
        run: >
          cargo run --locked -q -p indicate-evidence --bin evidence-gate --
          --graph docs/instruments/evidence-graph.evg --repo-root . --trace

      - name: evidence trace — selectors MUST resolve against the tree (HARD)
        # Every recorded case selector names a real test definition in this
        # tree; the graph travels with its sources, so a non-resolving
        # selector is a defect, not an expected absence.
        run: >
          cargo run --locked -q -p indicate-evidence --bin evidence-gate --
          --graph docs/instruments/evidence-graph.evg --repo-root .
          --resolve-selectors

      - name: evidence trace — baselines MUST be reachable and resolvable (HARD)
        # Every recorded result must resolve: its declared SCM baseline
        # reachable from HEAD (not a force-push orphan), its selectors and
        # artifacts present. Needs full history (fetch-depth: 0 above) so
        # reachability is decidable.
        run: >
          cargo run --locked -q -p indicate-evidence --bin evidence-gate --
          --graph docs/instruments/evidence-graph.evg --repo-root .
          --require-resolvable

      - name: Negative fixtures must all FAIL the gate
        run: |
          set -u
          bin=(cargo run --locked -q -p indicate-evidence --bin evidence-gate --)
          fail=0
          for f in empty missing-root missing-layer dangling-edge \
                   unresolved-selector orphan-requirement \
                   missing-result invalid-exception \
                   pending-review placeholder-result \
                   unexecuted-result unbacked-review; do
            if "${bin[@]}" --graph "$FIXTURES/$f.evg" \
                --repo-root crates/indicate-evidence >/dev/null 2>&1; then
              echo "REGRESSION: $f.evg unexpectedly PASSED the gate"; fail=1
            else
              echo "ok: $f.evg correctly failed the gate"
            fi
          done
          exit $fail

      - name: Exception expiry is actually enforced in the gate
        # The invalid-exception fixture is complete and independently reviewed
        # but EXPIRED. Past its expiry it must fail; before its expiry the
        # same exception legitimately applies. This proves the as-of date
        # drives the outcome and expiry is not silently skipped.
        run: |
          set -u
          bin=(cargo run --locked -q -p indicate-evidence --bin evidence-gate --)
          fixture="$FIXTURES/invalid-exception.evg"
          root=crates/indicate-evidence
          if "${bin[@]}" --graph "$fixture" --repo-root "$root" \
              --as-of 2026-07-14 >/dev/null 2>&1; then
            echo "REGRESSION: expired exception was not caught as of 2026-07-14"; exit 1
          fi
          echo "ok: expired exception fails once past its expiry"
          if "${bin[@]}" --graph "$fixture" --repo-root "$root" \
              --as-of 2019-01-01 >/dev/null 2>&1; then
            echo "ok: the same exception applies before its expiry"
          else
            echo "REGRESSION: exception rejected before its expiry date"; exit 1
          fi

      - name: Filesystem resolution rejects unresolvable evidence
        # These fixtures are structurally VALID and fail only when the gate
        # resolves them against the tree: a test selector naming a missing
        # symbol; an execution-output artifact that is absent, whose content
        # does not hash to its declared digest, whose parsed run-record fields
        # (including the run identity) disagree with the result, or which is a
        # source file with no run-record fields; an artifact path that is
        # absolute, climbs out via '..', or symlinks outside the evidence
        # root; and a review whose named record entry is still pending.
        run: |
          set -u
          bin=(cargo run --locked -q -p indicate-evidence --bin evidence-gate --)
          fail=0
          for f in unresolvable-selector-fs unresolvable-artifact \
                   mismatched-artifact field-mismatch-artifact \
                   runid-mismatch-artifact absolute-artifact \
                   traversal-artifact symlink-escape-artifact \
                   stale-source-artifact selector-not-a-test \
                   source-as-artifact unresolved-review-entry \
                   baseline-unverifiable baseline-unreachable; do
            if "${bin[@]}" --graph "$FIXTURES/$f.evg" \
                --repo-root crates/indicate-evidence \
                --resolve-selectors >/dev/null 2>&1; then
              echo "REGRESSION: $f.evg unexpectedly passed resolution"; fail=1
            else
              echo "ok: $f.evg correctly failed resolution"
            fi
          done
          exit $fail
